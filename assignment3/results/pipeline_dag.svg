<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="270" viewBox="0 0 1100 270">
  <rect width="1100" height="270" fill="#ffffff"/>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#333333"/>
    </marker>
  </defs>
  <g font-family="Arial, sans-serif" font-size="14" fill="#111111">
    <text x="32" y="34" font-size="20" font-weight="700">Mage DAG: mapping_qc</text>
    <g transform="translate(30,80)">
      <rect width="160" height="70" rx="6" fill="#e8f1ff" stroke="#3b73b9"/>
      <text x="20" y="32" font-weight="700">prepare_inputs</text>
      <text x="20" y="52">data_loader</text>
    </g>
    <line x1="190" y1="115" x2="260" y2="115" stroke="#333333" stroke-width="2" marker-end="url(#arrow)"/>
    <g transform="translate(260,80)">
      <rect width="180" height="70" rx="6" fill="#fff5db" stroke="#b98016"/>
      <text x="20" y="32" font-weight="700">run_mapping_qc</text>
      <text x="20" y="52">custom block</text>
    </g>
    <line x1="440" y1="115" x2="510" y2="115" stroke="#333333" stroke-width="2" marker-end="url(#arrow)"/>
    <g transform="translate(510,80)">
      <rect width="190" height="70" rx="6" fill="#e9f8ed" stroke="#2b8a4b"/>
      <text x="20" y="32" font-weight="700">parse_mapping_quality</text>
      <text x="20" y="52">transformer</text>
    </g>
    <line x1="700" y1="115" x2="770" y2="115" stroke="#333333" stroke-width="2" marker-end="url(#arrow)"/>
    <g transform="translate(770,80)">
      <rect width="190" height="70" rx="6" fill="#f1eafe" stroke="#6f42c1"/>
      <text x="20" y="32" font-weight="700">write_mapping_report</text>
      <text x="20" y="52">data_exporter</text>
    </g>
    <text x="32" y="210">Decision rule: mapped_percent &gt; 90% =&gt; OK; otherwise not OK.</text>
  </g>
